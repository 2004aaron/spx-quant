AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time setup for StormGlass deploys. Lets GitHub Actions in 2004aaron/stormglass-ops (main
  branch only) deploy the settings site without any long-lived AWS keys: GitHub proves who it
  is with a short-lived token (OIDC) and AWS hands it this role for that one run. The role can
  only touch StormGlass resources. Create this stack once in the CloudFormation console.

Parameters:
  GitHubRepo:
    Type: String
    Default: 2004aaron/stormglass-ops
  GitHubRepoIds:
    Type: String
    Default: 2004aaron@49879093/stormglass-ops@1426293623
    Description: The same repo as GitHub now names it in the token subject (owner@id/repo@id)

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: stormglass-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref GitHubOidc}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:ref:refs/heads/main
                  - !Sub repo:${GitHubRepoIds}:ref:refs/heads/main
      Policies:
        - PolicyName: stormglass-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Stacks
                Effect: Allow
                Action: cloudformation:*
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/stormglass*/*
                  - !Sub arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*
                  - !Sub arn:${AWS::Partition}:cloudformation:*:aws:transform/Serverless-2016-10-31
              - Sid: StackReads
                Effect: Allow
                Action: [cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary, cloudformation:ListStacks]
                Resource: "*"
              - Sid: Artifacts
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default*
                  - !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default*/*
              - Sid: LogBucket
                Effect: Allow
                Action: s3:*
                Resource:
                  - !Sub arn:${AWS::Partition}:s3:::stormglass-logs-${AWS::AccountId}
                  - !Sub arn:${AWS::Partition}:s3:::stormglass-logs-${AWS::AccountId}/*
              - Sid: FunctionRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/stormglass-*
              - Sid: Services
                Effect: Allow
                Action: [lambda:*, apigateway:*, cognito-idp:*]
                Resource: "*"
              - Sid: Schedules
                Effect: Allow
                Action: scheduler:*
                Resource:
                  - !Sub arn:${AWS::Partition}:scheduler:*:${AWS::AccountId}:schedule/default/*
                  - !Sub arn:${AWS::Partition}:scheduler:*:${AWS::AccountId}:schedule-group/default
              - Sid: Table
                Effect: Allow
                Action: dynamodb:*
                Resource: !Sub arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/stormglass-*
              - Sid: SmtpParams
                Effect: Allow
                Action: [ssm:PutParameter, ssm:GetParameter, ssm:GetParameters, ssm:AddTagsToResource]
                Resource: !Sub arn:${AWS::Partition}:ssm:*:${AWS::AccountId}:parameter/stormglass/*

Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
