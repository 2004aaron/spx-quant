AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  StormGlass settings site. Email-code sign-in (Cognito custom auth, invite-only), one Lambda
  that serves the page and the profile API behind an HTTP API, one DynamoDB row per user.
  Also what the scan runner needs: a private bucket for the plain log copies and a role that
  can only read the users table and write under logs/ in that bucket.
  With a Temporal address set, also the Lambda worker that sends the Monday and Friday emails.

Parameters:
  SmtpParam:
    Type: String
    Default: /stormglass/smtp
    Description: SSM path holding the Gmail SMTP user and app password (SecureString)
  GitHubRepo:
    Type: String
    Default: 2004aaron/stormglass-ops
    Description: The runner repo. Only its main branch can take the runner role.
  GitHubRepoIds:
    Type: String
    Default: 2004aaron@49879093/stormglass-ops@1426293623
    Description: The same repo as GitHub now names it in the token subject (owner@id/repo@id)
  TemporalAddress:
    Type: String
    Default: ""
    Description: Temporal Cloud endpoint, host:port. Empty leaves the worker out of the stack.
  TemporalNamespace:
    Type: String
    Default: ""
    Description: Temporal Cloud namespace, name.account
  TemporalKeyParam:
    Type: String
    Default: /stormglass/temporal/api_key
    Description: SSM path holding the Temporal Cloud API key (SecureString)
  WorkerBuildId:
    Type: String
    Default: "1"
    Description: Build id the worker reports. Must match the Worker Deployment Version in Temporal Cloud.

Conditions:
  HasTemporal: !Not [!Equals [!Ref TemporalAddress, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    Timeout: 15
    MemorySize: 256
    CodeUri: app/

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: stormglass-users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: email, AttributeType: S}]
      KeySchema: [{AttributeName: email, KeyType: HASH}]
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: auth.handler
      Environment:
        Variables: {SMTP_PARAM: !Ref SmtpParam}
      Policies:
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SmtpParam}/*

  AuthPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt AuthFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: stormglass-users
      UsernameAttributes: [email]
      AdminCreateUserConfig: {AllowAdminCreateUserOnly: true}
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: admin_only, Priority: 1}]
      # A signed-in user cannot swap their email for someone else's: a new email only takes effect once
      # verified, and the site's client cannot write it at all (UserPoolClient.WriteAttributes).
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: [email]
      LambdaConfig:
        DefineAuthChallenge: !GetAtt AuthFunction.Arn
        CreateAuthChallenge: !GetAtt AuthFunction.Arn
        VerifyAuthChallengeResponse: !GetAtt AuthFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: stormglass-site
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_CUSTOM_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      ReadAttributes: [email, email_verified]
      WriteAttributes: [locale]
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED
      AuthSessionValidity: 10
      IdTokenValidity: 60
      AccessTokenValidity: 60
      TokenValidityUnits: {IdToken: minutes, AccessToken: minutes}

  SiteApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Auth:
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: api.handler
      MemorySize: 512
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          CLIENT_ID: !Ref UserPoolClient
          LOG_BUCKET: !Ref LogBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:PutItem]
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${LogBucket.Arn}/logs/*
      Events:
        Page:
          Type: HttpApi
          Properties: {ApiId: !Ref SiteApi, Method: GET, Path: /}
        GetProfile:
          Type: HttpApi
          Properties: {ApiId: !Ref SiteApi, Method: GET, Path: /api/profile, Auth: {Authorizer: Cognito}}
        PutProfile:
          Type: HttpApi
          Properties: {ApiId: !Ref SiteApi, Method: PUT, Path: /api/profile, Auth: {Authorizer: Cognito}}
        GetPortfolio:
          Type: HttpApi
          Properties: {ApiId: !Ref SiteApi, Method: GET, Path: /api/portfolio, Auth: {Authorizer: Cognito}}

  LogBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub stormglass-logs-${AWS::AccountId}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}

  # GitHub proves which repo and branch a run belongs to with a short-lived token (OIDC); the
  # provider it is checked against comes from bootstrap.yaml. No AWS keys are stored anywhere.
  RunnerRole:
    Type: AWS::IAM::Role
    Properties:
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubRepo}:ref:refs/heads/main
                  - !Sub repo:${GitHubRepoIds}:ref:refs/heads/main
      Policies:
        - PolicyName: stormglass-runner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadSettings
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt UsersTable.Arn
              - Sid: WriteLogs
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${LogBucket.Arn}/logs/*

  # Temporal Cloud invokes this function when a workflow or activity task is waiting. It takes a role created
  # from Temporal's own template (docs/operations.md), not anything in this stack.
  WorkerFunction:
    Type: AWS::Serverless::Function
    Condition: HasTemporal
    Properties:
      FunctionName: stormglass-worker
      CodeUri: worker/
      Handler: worker.lambda_handler
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          TEMPORAL_ADDRESS: !Ref TemporalAddress
          TEMPORAL_NAMESPACE: !Ref TemporalNamespace
          TEMPORAL_KEY_PARAM: !Ref TemporalKeyParam
          BUILD_ID: !Ref WorkerBuildId
          USERS_TABLE: !Ref UsersTable
          LOG_BUCKET: !Ref LogBucket
          SMTP_PARAM: !Ref SmtpParam
          STORMGLASS_SITE_URL: !Sub https://${SiteApi}.execute-api.${AWS::Region}.amazonaws.com/
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${LogBucket.Arn}/logs/*
            - Effect: Allow
              Action: s3:ListBucket
              Resource: !GetAtt LogBucket.Arn
            - Effect: Allow
              Action: ssm:GetParameters
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SmtpParam}/*
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${TemporalKeyParam}

Outputs:
  SiteUrl:
    Value: !Sub https://${SiteApi}.execute-api.${AWS::Region}.amazonaws.com/
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref UserPoolClient
  UsersTableName:
    Value: !Ref UsersTable
  RunnerRoleArn:
    Description: Goes in the runner repo variable AWS_RUNNER_ROLE_ARN
    Value: !GetAtt RunnerRole.Arn
  LogBucketName:
    Value: !Ref LogBucket
  WorkerFunctionArn:
    Condition: HasTemporal
    Description: The function Temporal Cloud invokes; goes in Temporal's role template and the Worker Deployment Version
    Value: !GetAtt WorkerFunction.Arn
