name: tests
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v
  # The AWS and Temporal code under cloud/, with its own packages; `unit` above stays standard library only.
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r cloud/requirements-dev.txt
      - run: cfn-lint cloud/template.yaml cloud/bootstrap.yaml
      - run: python -m unittest tests.test_cloud tests.test_aws_digests tests.test_siteprofile tests.test_logdoc tests.test_temporal -v
