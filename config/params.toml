# Every parameter below must have a matching [provenance."section.key"] entry with a
# tag from {validated, unvalidated, "unvalidated: tested, not supported",
# "unvalidated: partially supported"} and a source. Loading fails otherwise (US-12).

[regime]
contango_slope = 0.05
backwardation_slope = -0.01

[vol_buckets]
crushed_below = 13.0
low_below = 16.0
normal_below = 20.0
elevated_below = 28.0

[strangle]
target_delta = 0.16
target_dte = 45
dte_min = 30
dte_max = 60
profit_target = 0.50

[liquidity]
min_open_interest = 50
min_volume = 25
max_spread_pct = 0.25
min_mid = 0.30

[feed]
stale_after_minutes = 30
timeout_seconds = 30

