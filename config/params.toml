# Every parameter below must have a matching [provenance."section.key"] entry with a
# tag from {validated, unvalidated, "unvalidated: tested, not supported",
# "unvalidated: partially supported"} and a source. Loading fails otherwise.
# The account profile (size, margin type, caps, notification address) is NOT here:
# it lives in a local file that is never committed (QR-5).

[regime]
contango_slope = 0.05
backwardation_slope = -0.01

[vol_buckets]
crushed_below = 13.0     # volatility floor (US-04-AC2)
low_below = 16.0
normal_below = 20.0
elevated_below = 28.0    # volatility ceiling (US-04-AC1)

[playbook]
low = ["strangle", "naked_put", "iron_condor", "put_vertical"]
normal = ["strangle", "naked_put", "iron_condor", "put_vertical"]
elevated = ["strangle", "naked_put", "iron_condor", "put_vertical"]

[expiry]
target_dte = 45
dte_min = 30
dte_max = 60

[strangle]
target_delta = 0.16

[naked_put]
target_delta = 0.16

[put_vertical]
short_delta = 0.25
width_pct = 0.0075

[iron_condor]
short_delta = 0.16
width_pct = 0.0075

[liquidity]
min_open_interest = 50
min_volume = 25
max_spread_pct = 0.25
min_mid = 0.30

[margin]
regt_index_pct = 0.15
regt_min_pct = 0.10
pm_down = -0.15
pm_up = 0.10
pm_points = 10
pm_min_per_contract = 37.50
pm_house_multiplier = 1.0

[risk]
vrp_haircut = 0.10
crash_prob_annual = 0.25
crash_size = -0.15
rate = 0.04
min_pop = 0.60
worst_case_move = -0.10
worst_case_vol_points = 10.0
stress_moves = [-0.20, -0.10, -0.05, 0.05, 0.10]
grid_points = 2001

[management]
profit_target = 0.50
loss_multiple = 2.0
defensive_dte = 21
tested_delta = 0.30

[feed]
stale_after_minutes = 30
timeout_seconds = 30
min_rows = 1000
tickers = ["_SPX", "_XSP"]

[schedule]
slots = ["10:30", "13:25"]
eod_slot = "13:25"
mark_time = "13:45"

[notify]
repeat_policy = "brief"
max_attempts = 3
retry_wait_seconds = 5
latency_target_minutes = 20

