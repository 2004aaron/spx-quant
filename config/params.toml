# Every parameter below must have a matching [provenance."section.key"] entry with a
# tag from {validated, unvalidated, "unvalidated: tested, not supported",
# "unvalidated: partially supported"} and a source. Loading fails otherwise.
# The account profile (size, margin type, caps) is NOT here:
# it lives in a local file that is never committed (QR-5).

[regime]
contango_slope = 0.05
backwardation_slope = -0.01

[gate]
# Which regime readings stop a scan with STAND DOWN. Anything not listed is shown as
# information on the alert but does not block a proposal (rule options: backwardation,
# vol_floor, vol_ceiling).
stand_down_on = ["vol_floor", "vol_ceiling"]

[vol_buckets]
crushed_below = 13.0     # volatility floor (US-04-AC2)
low_below = 16.0
normal_below = 20.0
elevated_below = 28.0    # volatility ceiling (US-04-AC1)

[playbook]
low = ["strangle", "naked_put", "put_vertical"]
normal = ["strangle", "naked_put", "put_vertical"]
elevated = ["strangle", "naked_put", "put_vertical"]

[expiry]
target_dte = 60
dte_min = 45
dte_max = 75

[strangle]
target_delta = 0.16

[naked_put]
target_delta = 0.16

[put_vertical]
short_delta = 0.16
width_pct = 0.05

[iron_condor]
short_delta = 0.16
width_pct = 0.0075

[liquidity]
min_open_interest = 50
min_volume = 25
max_spread_pct = 0.25
min_mid = 0.30
max_fill_cost_pct = 0.25   # reject a structure whose natural fill gives up more than this share of the mid credit

[trend]
# 50-day vs 200-day SMA of the SPX close. Strategies in up_only are offered only when the 50-day
# is above the 200-day; missing or stale history counts as not up.
fast_sma = 50
slow_sma = 200
max_age_days = 5
up_only = ["naked_put", "put_vertical"]
prefer_up = ["naked_put"]
# 1:N delta:theta limits for the bullish structures in an uptrend (used when looser than the profile's)
naked_put_delta_theta = 0.5
put_vertical_delta_theta = 0.25

[margin]
regt_index_pct = 0.15
regt_min_pct = 0.10
pm_down = -0.15
pm_up = 0.10
pm_points = 10
pm_min_per_contract = 37.50
pm_house_multiplier = 1.0

[risk]
vrp_haircut = 0.10
crash_prob_annual = 0.25
crash_size = -0.15
rate = 0.04
min_pop = 0.60
worst_case_move = -0.10
worst_case_vol_points = 10.0
stress_moves = [-0.20, -0.10, -0.05, 0.05, 0.10]
grid_points = 2001

[feed]
stale_after_minutes = 30
timeout_seconds = 30
min_rows = 1000
tickers = ["_SPX", "_XSP"]

[schedule]
slots = ["10:30", "13:25"]
eod_slot = "13:25"

[provenance]
